name: Release marketplace bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketplace version, e.g. 0.1.0 (existing tags are never overwritten)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/marketplace.py bundle
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "v$VERSION" dist/chatgpt-plugin-marketplace.zip dist/SHA256SUMS --target "$COMMIT" --title "Plugin Marketplace $VERSION" --notes-file CATALOG.md --fail-on-no-commits
